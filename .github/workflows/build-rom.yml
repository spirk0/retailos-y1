name: Build retailOS ROM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SDK: /home/runner/Android/Sdk
      NDK: /home/runner/android-ndk-r10e

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android SDK components
      run: |
        sudo apt-get update
        sudo apt-get install -y zip lib32z1
        mkdir -p $SDK/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
        unzip -q /tmp/clt.zip -d $SDK/cmdline-tools
        mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
        yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses
        $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-17" "build-tools;36.0.0"

    - name: Install Android NDK r10e
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip -O /tmp/ndk.zip
        unzip -q /tmp/ndk.zip -d /home/runner

    - name: Build the app
      run: ./build-apk.sh

    - name: Bundle rom.zip
      run: |
        mkdir base
        cd base
        wget -q https://github.com/rockbox-y1/rockbox/releases/download/type-a-base/rom.zip
        unzip -q rom.zip
        mkdir mount_sys
        mkdir mount_user
        sudo mount -t ext4 -o loop system.img mount_sys
        sudo mount -t ext4 -o loop userdata.img mount_user

        sudo rm -f mount_sys/app/org.rockbox.apk
        sudo rm -f mount_user/data/com.innioasis.y1.apk

        sudo cp ../android-app/build/retailos-native.apk mount_sys/app/org.retailos.apk
        sudo chmod 644 mount_sys/app/org.retailos.apk
        sudo chown root:root mount_sys/app/org.retailos.apk

        sudo rm -f mount_sys/bin/wifi_init
        sudo rm -f mount_sys/bin/wifi_check
        sudo rm -f mount_sys/bin/aggdll
        sudo rm -f mount_sys/bin/net_server
        sudo umount mount_sys
        sudo umount mount_user
        rm rom.zip
        rm -r mount_sys
        rm -r mount_user
        cd ..
        zip -j rom.zip base/*

    - name: Set release date
      id: date
      run: echo "release_date=$(date +'%d-%m-%Y')" >> $GITHUB_OUTPUT

    - name: Create release
      id: create_release
      uses: shogo82148/actions-create-release@v1
      with:
        release_name: retailOS Nightly-${{ steps.date.outputs.release_date }}
        tag_name: nightly-${{ github.sha }}
        prerelease: false
        make_latest: true

    - name: Upload rom.zip
      uses: shogo82148/actions-upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./rom.zip
        asset_name: rom.zip
        asset_content_type: application/zip
